<svg xmlns="http://www.w3.org/2000/svg" width="320" height="980" viewBox="0 0 320 980" role="img" aria-labelledby="title desc">
  <title id="title">DingTalk mobile notification card preview</title>
  <desc id="desc">A vector preview of several DingTalk ActionCard product notifications with images, price, seller metadata and action buttons.</desc>
  <style>
    .bg{fill:#eef2f7}.panel{fill:#fff;stroke:#d7dde8;stroke-width:1}.muted{fill:#64748b;font-size:10px}.title{fill:#111827;font-size:16px;font-weight:700}.text{fill:#111827;font-size:12px}.price{fill:#e11d48;font-size:15px;font-weight:700}.button{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}.btntext{fill:#2563eb;font-size:12px}.img1{fill:#d8dee9}.img2{fill:#cbd5e1}.img3{fill:#e5e7eb}.apple{fill:#111827;font-size:34px;font-weight:700}.badge{fill:#ef4444;font-size:15px;font-weight:700}.small{fill:#475569;font-size:11px}.line{stroke:#e5e7eb;stroke-width:1}
  </style>
  <rect class="bg" width="320" height="980" rx="0"/>
  <text x="24" y="32" class="muted">钉钉移动端推送效果</text>
  <g transform="translate(42,58)">
    <rect class="panel" width="236" height="282" rx="12"/>
    <rect class="img1" x="12" y="12" width="212" height="112" rx="8"/>
    <text x="95" y="78" class="apple"></text>
    <text x="14" y="150" class="title">闲鱼 AI 智能监控：<tspan class="badge">🚨</tspan> 新推荐！</text>
