    <rect class="img2" x="12" y="12" width="212" height="112" rx="8"/>
    <text x="95" y="78" class="apple"></text>
    <text x="14" y="150" class="title">闲鱼 AI 智能监控：<tspan class="badge">🚨</tspan> 新推荐！</text>
    <text x="14" y="174" class="text">苹果Mac mini 主机 M2 插电即用，接口齐全，</text>
    <text x="14" y="192" class="text">HDMI、USB都有，带电源线...</text>
    <text x="14" y="216" class="price">价格：¥2650</text>
    <text x="14" y="236" class="small">地区：山东 ｜ 发布时间：2026-06-11</text>
    <text x="14" y="256" class="small">卖家：佚静静 ｜ 想要：9 ｜ 浏览：117</text>
    <line class="line" x1="14" y1="268" x2="222" y2="268"/>
    <rect class="button" x="16" y="278" width="96" height="28" rx="14"/>
    <rect class="button" x="124" y="278" width="96" height="28" rx="14"/>
    <text x="42" y="297" class="btntext">发起聊天</text>
    <text x="150" y="297" class="btntext">立即查看</text>
  </g>
  <g transform="translate(42,682)">
    <rect class="panel" width="236" height="260" rx="12"/>
    <rect class="img3" x="12" y="12" width="212" height="112" rx="8"/>
    <text x="95" y="78" class="apple"></text>
    <text x="14" y="150" class="title">闲鱼 AI 智能监控：<tspan class="badge">🚨</tspan> 新推荐！</text>
    <text x="14" y="174" class="text">iPhone 14 Pro Max 128G 国行，几乎全新，</text>
    <text x="14" y="192" class="text">功能正常，拍照清晰，日常闲置...</text>
