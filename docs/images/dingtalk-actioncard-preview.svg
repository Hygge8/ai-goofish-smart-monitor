<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-labelledby="title desc">
  <title id="title">DingTalk ActionCard notification preview</title>
  <desc id="desc">Vector preview of DingTalk mobile ActionCard product notifications.</desc>
  <defs>
    <linearGradient id="phoneBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="imageBg1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="imageBg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <style>
      .page{fill:#eef2f7}.phone{fill:url(#phoneBg);stroke:#dbe3ef;stroke-width:1.2}.bar{fill:#dbeafe}.card{fill:#fff;stroke:#d9e2ef;stroke-width:1.2}.muted{fill:#64748b;font-size:11px;font-family:Arial,'Microsoft YaHei',sans-serif}.title{fill:#0f172a;font-size:17px;font-weight:700;font-family:Arial,'Microsoft YaHei',sans-serif}.body{fill:#111827;font-size:12.5px;font-family:Arial,'Microsoft YaHei',sans-serif}.small{fill:#475569;font-size:11.5px;font-family:Arial,'Microsoft YaHei',sans-serif}.price{fill:#e11d48;font-size:18px;font-weight:700;font-family:Arial,'Microsoft YaHei',sans-serif}.btn{fill:#f8fafc;stroke:#dbe3ef;stroke-width:1}.btntext{fill:#2563eb;font-size:13px;font-family:Arial,'Microsoft YaHei',sans-serif}.line{stroke:#e5e7eb;stroke-width:1}.tag{fill:#dbeafe}.tagtext{fill:#2563eb;font-size:11px;font-family:Arial,'Microsoft YaHei',sans-serif}.camera{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.product{fill:#94a3b8}.productDark{fill:#475569}
    </style>
  </defs>
  <rect class="page" width="360" height="720"/>
  <rect class="phone" x="38" y="26" width="284" height="668" rx="28"/>
  <rect class="bar" x="76" y="50" width="208" height="28" rx="14"/>
  <text x="94" y="69" class="muted">钉钉群 · 闲鱼智能监控</text>

  <g transform="translate(62,104)">
    <rect class="card" width="236" height="266" rx="14"/>
    <rect x="14" y="14" width="208" height="104" rx="10" fill="url(#imageBg1)"/>
    <rect x="84" y="34" width="54" height="58" rx="12" class="product"/>
    <circle cx="118" cy="49" r="5" class="productDark"/>
    <rect x="101" y="97" width="20" height="5" rx="2.5" class="productDark"/>
    <text x="14" y="144" class="title">闲鱼 AI 智能监控：新推荐！</text>
    <text x="14" y="169" class="body">苹果15 Pro 128G 黑色，国行，</text>
    <text x="14" y="187" class="body">成色挺好，原装正品，没拆修...</text>
    <text x="14" y="214" class="price">价格：¥4078</text>
    <text x="14" y="237" class="small">地区：湖北 ｜ 发布时间：2026-05-12</text>
    <text x="14" y="257" class="small">卖家：羊城口不特聊的柜手 ｜ 想要：2</text>
  </g>
  <g transform="translate(62,348)">
    <rect class="btn" x="8" y="0" width="104" height="34" rx="17"/>
    <rect class="btn" x="124" y="0" width="104" height="34" rx="17"/>
    <text x="35" y="22" class="btntext">发起聊天</text>
    <text x="151" y="22" class="btntext">立即查看</text>
  </g>

  <g transform="translate(62,410)">
    <rect class="card" width="236" height="218" rx="14"/>
    <rect x="14" y="14" width="208" height="86" rx="10" fill="url(#imageBg2)"/>
    <rect x="78" y="36" width="82" height="50" rx="10" class="product"/>
    <rect x="96" y="48" width="46" height="27" rx="5" class="productDark"/>
    <text x="14" y="126" class="title">闲鱼 AI 智能监控：新推荐！</text>
    <text x="14" y="151" class="body">苹果Mac mini 主机 M2 插电即用，</text>
    <text x="14" y="169" class="body">接口齐全，带电源线，功能正常...</text>
    <text x="14" y="196" class="price">价格：¥2650</text>
  </g>
  <g transform="translate(62,610)">
    <rect class="btn" x="8" y="0" width="104" height="34" rx="17"/>
    <rect class="btn" x="124" y="0" width="104" height="34" rx="17"/>
    <text x="35" y="22" class="btntext">发起聊天</text>
    <text x="151" y="22" class="btntext">立即查看</text>
  </g>
</svg>
