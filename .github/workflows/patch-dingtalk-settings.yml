name: Patch DingTalk Settings UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-dingtalk-settings.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Patch DingTalk settings support
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # Backend API model: allow DINGTALK_* fields through Pydantic request model.
          p = Path('src/api/routes/settings.py')
          s = read(p)
          if 'DINGTALK_WEBHOOK: Optional[str] = None' not in s:
              s = s.replace(
                  '    WX_BOT_URL: Optional[str] = None\n',
                  '    WX_BOT_URL: Optional[str] = None\n'
                  '    DINGTALK_WEBHOOK: Optional[str] = None\n'
                  '    DINGTALK_SECRET: Optional[str] = None\n'
              )
              write(p, s)

          # Frontend API types.
          p = Path('web-ui/src/api/settings.ts')
          s = read(p)
          if 'DINGTALK_WEBHOOK?: string' not in s:
              s = s.replace("  WX_BOT_URL?: string\n", "  WX_BOT_URL?: string\n  DINGTALK_WEBHOOK?: string\n  DINGTALK_SECRET?: string\n")
              s = s.replace("  WX_BOT_URL_SET?: boolean\n", "  WX_BOT_URL_SET?: boolean\n  DINGTALK_WEBHOOK_SET?: boolean\n  DINGTALK_SECRET_SET?: boolean\n")
              s = s.replace("  WX_BOT_URL?: string | null\n", "  WX_BOT_URL?: string | null\n  DINGTALK_WEBHOOK?: string | null\n  DINGTALK_SECRET?: string | null\n")
              s = s.replace("    wx_bot_url_set: boolean\n", "    wx_bot_url_set: boolean\n    dingtalk_webhook_set: boolean\n    dingtalk_secret_set: boolean\n")
              write(p, s)

          # Frontend settings panel.
          p = Path('web-ui/src/components/settings/NotificationSettingsPanel.vue')
          s = read(p)
          if "'dingtalk'" not in s.split('type ChannelKey', 1)[1].split('\n', 1)[0]:
              s = s.replace(
                  "type ChannelKey = 'ntfy' | 'bark' | 'gotify' | 'wecom' | 'telegram' | 'webhook'",
                  "type ChannelKey = 'ntfy' | 'bark' | 'gotify' | 'wecom' | 'dingtalk' | 'telegram' | 'webhook'"
              )
              s = s.replace(
                  "const secretFields = ['BARK_URL', 'GOTIFY_TOKEN', 'WX_BOT_URL', 'TELEGRAM_BOT_TOKEN', 'WEBHOOK_URL', 'WEBHOOK_HEADERS'] as const",
                  "const secretFields = ['BARK_URL', 'GOTIFY_TOKEN', 'WX_BOT_URL', 'DINGTALK_WEBHOOK', 'DINGTALK_SECRET', 'TELEGRAM_BOT_TOKEN', 'WEBHOOK_URL', 'WEBHOOK_HEADERS'] as const"
              )
              s = s.replace(
                  "  wecom: ['WX_BOT_URL'],\n  telegram:",
                  "  wecom: ['WX_BOT_URL'],\n  dingtalk: ['DINGTALK_WEBHOOK', 'DINGTALK_SECRET'],\n  telegram:"
              )
              s = s.replace(
                  "    WX_BOT_URL: '',\n    TELEGRAM_BOT_TOKEN:",
                  "    WX_BOT_URL: '',\n    DINGTALK_WEBHOOK: '',\n    DINGTALK_SECRET: '',\n    TELEGRAM_BOT_TOKEN:"
              )
              s = s.replace(
                  "  secretConfigured.WX_BOT_URL = !!settings.WX_BOT_URL_SET\n  secretConfigured.TELEGRAM_BOT_TOKEN",
                  "  secretConfigured.WX_BOT_URL = !!settings.WX_BOT_URL_SET\n  secretConfigured.DINGTALK_WEBHOOK = !!settings.DINGTALK_WEBHOOK_SET\n  secretConfigured.DINGTALK_SECRET = !!settings.DINGTALK_SECRET_SET\n  secretConfigured.TELEGRAM_BOT_TOKEN"
              )
              dingtalk_card = '''\n\n        <Card class="app-surface-subtle overflow-hidden border-l-4 border-l-blue-500">\n          <CardHeader><CardTitle>钉钉机器人</CardTitle><CardDescription>使用钉钉 ActionCard 图文卡片，展示商品图片，并将链接放入按钮，避免正文出现长链接。</CardDescription></CardHeader>\n          <CardContent class="grid gap-4 md:grid-cols-2">\n            <div class="grid gap-2"><Label>DingTalk Webhook</Label><Input type="password" :model-value="form.DINGTALK_WEBHOOK ?? ''" :placeholder="t('notifyPanel.secretKeepPlaceholder')" @update:model-value="(value) => updateSecretField('DINGTALK_WEBHOOK', String(value))" /><p class="text-xs text-slate-500">{{ secretConfigured.DINGTALK_WEBHOOK ? t('notifyPanel.secretConfigured') : t('notifyPanel.notConfigured') }}</p></div>\n            <div class="grid gap-2"><Label>DingTalk Secret</Label><Input type="password" :model-value="form.DINGTALK_SECRET ?? ''" :placeholder="t('notifyPanel.secretKeepPlaceholder')" @update:model-value="(value) => updateSecretField('DINGTALK_SECRET', String(value))" /><p class="text-xs text-slate-500">{{ secretConfigured.DINGTALK_SECRET ? t('notifyPanel.secretConfigured') : '未配置加签，可留空' }}</p></div>\n          </CardContent>\n          <CardFooter class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><Badge :variant="isChannelConfigured('dingtalk') ? 'default' : 'outline'">{{ resolveChannelBadge('dingtalk') }}</Badge><div class="flex flex-wrap gap-2"><Button variant="ghost" size="sm" :disabled="props.isSaving" @click="clearChannel('dingtalk')"><Trash2 class="h-4 w-4" />{{ t('notifyPanel.clear') }}</Button><Button variant="outline" size="sm" :disabled="props.isSaving" @click="handleTest('dingtalk')"><TestTube2 class="h-4 w-4" />{{ t('notifyPanel.test') }}</Button></div></CardFooter>\n        </Card>\n'''
              marker = "        <Card class=\"app-surface-subtle overflow-hidden border-l-4 border-l-cyan-500\">"
              s = s.replace(marker, dingtalk_card + "\n" + marker)
              s = s.replace("['ntfy', 'bark', 'gotify', 'wecom', 'telegram', 'webhook']", "['ntfy', 'bark', 'gotify', 'wecom', 'dingtalk', 'telegram', 'webhook']")
              write(p, s)

      - name: Commit patches
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Add DingTalk settings UI support [skip ci]"
          git push origin HEAD:main
