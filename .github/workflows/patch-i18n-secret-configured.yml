name: Patch i18n secretConfigured

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-i18n-secret-configured.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch i18n keys
        shell: python
        run: |
          from pathlib import Path
          patches = [
              (Path('web-ui/src/i18n/messages/zh-CN-extra.ts'), "    secretKeepPlaceholder: '已配置则留空保留',", "    secretConfigured: '已配置敏感值，当前页面不回显。',"),
              (Path('web-ui/src/i18n/messages/en-US-extra.ts'), "    secretKeepPlaceholder: 'Leave blank to keep the current value',", "    secretConfigured: 'A sensitive value is configured and hidden on this page.',"),
          ]
          for path, anchor, insert in patches:
              text = path.read_text(encoding='utf-8')
              if 'secretConfigured:' not in text:
                  text = text.replace(anchor, anchor + '\n' + insert)
                  path.write_text(text, encoding='utf-8')
      - name: Commit if changed
        run: |
          git add web-ui/src/i18n/messages/*-extra.ts
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Add missing secretConfigured i18n key [skip ci]"
          git push origin HEAD:main
