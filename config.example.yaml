monitor:
  interval_seconds: 60
  headless: true
  max_items_per_keyword: 20
  storage_db: data/goofish.db
  user_data_dir: state/browser

accounts:
  dir: state/accounts
  default: acc1

dingtalk:
  enabled: true
  use_action_card: true

web:
  enabled: true
  host: 0.0.0.0
  port: 8080

# 全品类任务示例：每个任务独立关键词、账号、价格、偏好词、排除词、推荐分阈值和降价提醒。
tasks:
  - name: 数码相机
    keyword: 索尼相机
    account: acc1
    min_price: 1000
    max_price: 8000
    min_score: 65
    notify_price_drop: true
    price_drop_ratio: 0.05      # 降幅达到 5% 时提醒
    price_drop_amount: 100      # 或下降金额达到 100 元时提醒
    score_weights:
      text: 0.35
      price: 0.25
      seller: 0.20
      vision: 0.20
    include_words:
      - 自用
      - 成色好
      - 配件齐全
      - 实拍
      - 发票
    exclude_words:
      - 故障
      - 维修
      - 进水
      - 翻新
      - 网图

  - name: 摩托车
    keyword: 摩托车
    account: acc1
    min_price: 1000
    max_price: 20000
    min_score: 70
    notify_price_drop: true
    price_drop_ratio: 0.03      # 摩托车金额较大，降幅 3% 即提醒
    price_drop_amount: 300
    score_weights:
      text: 0.30
      price: 0.30
      seller: 0.25
      vision: 0.15
    include_words:
      - 准新
      - 个人
      - 自用
      - 无事故
      - 赛科龙
      - 春风
      - 豪爵
    exclude_words:
      - 事故
      - 水泡
      - 抵押
      - 报废
      - 分期
      - 车商勿扰
